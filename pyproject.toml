[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanpipe"
version = "0.1.0"
description = "CLI output filter for AI agents — strip noise, keep signal, save tokens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = ["cli", "ai", "agent", "filter", "tokens", "productivity"]
classifiers = [
    "Development Status :: 4 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = ["click>=8.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
leanpipe = "leanpipe.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/leanpipe"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The lint gate is pinned explicitly rather than relying on ruff's default rule
# set: the defaults change between ruff releases, so an unpinned `ruff check .`
# would make CI pass or fail based on nothing but the installed version.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
# BLE001 and PL* are intentionally not enabled: run_command() deliberately
# wraps subprocess failures for the CLI, and narrowing those catches changes
# runtime error behaviour rather than fixing a defect.
